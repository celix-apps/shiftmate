<style>
:root{--bg:#f6f8fc;--card:#ffffff;--text:#15171c;--muted:#5b6170;--line:#e3e7ef;--accent:#007AFF;--accent-text:#ffffff;--chip:#eef3fb}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#171a21;--text:#eef1f6;--muted:#a3aab8;--line:#2a2f3a;--accent:#0A84FF;--accent-text:#ffffff;--chip:#1e2430}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,"PingFang TC","PingFang SC","Hiragino Sans","Apple SD Gothic Neo",sans-serif}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;color:var(--text)}
.brand img{width:36px;height:36px;border-radius:9px}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:48vw}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding:28px 0 40px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);margin:0 0 22px}
.intro{color:var(--muted);margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:14px;font-weight:600;text-decoration:none}
.btn.play{background:var(--accent);color:var(--accent-text)}
.btn.ios{background:var(--chip);color:var(--muted);cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.free{font-size:14px;color:var(--muted);margin-top:12px}
.shots{display:flex;gap:14px;justify-content:center}
.shots img{width:31%;max-width:200px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);background:var(--card)}
.shots img:nth-child(2){transform:translateY(-18px)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:10px 0 50px}
.f{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.f h2{font-size:13px;letter-spacing:.06em;color:var(--accent);margin:0 0 10px}
.f ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.f li{margin:4px 0}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
footer a{color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:26px;padding-top:10px}.shots img:nth-child(2){transform:none}}
</style>
